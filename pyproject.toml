[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilantia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "requests",
    "PyYAML",
    "beautifulsoup4",
    "playwright",
    "langdetect",
    "jinja2",
]

[project.scripts]
vigilantia = "vigilantia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]